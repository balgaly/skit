<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>
  <!-- Package icon -->
  <g transform="translate(16, 20)">
    <!-- Box body -->
    <rect x="4" y="28" width="72" height="52" rx="6" fill="url(#accent)" opacity="0.9"/>
    <!-- Box lid -->
    <path d="M0 28 L40 8 L80 28 L40 48 Z" fill="url(#accent)"/>
    <!-- Box center line -->
    <line x1="40" y1="48" x2="40" y2="80" stroke="#fff" stroke-width="2" opacity="0.4"/>
    <line x1="40" y1="48" x2="80" y2="28" stroke="#fff" stroke-width="2" opacity="0.4"/>
    <!-- Arrow pointing up-right (skill transfer) -->
    <g transform="translate(50, 12)">
      <line x1="0" y1="20" x2="20" y2="0" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
      <polyline points="10,0 20,0 20,10" fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Text: skit -->
  <text x="116" y="78" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#F1F5F9">skit</text>
  <!-- Tagline -->
  <text x="118" y="100" font-family="'SF Pro Text', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5" fill="#94A3B8">package manager for AI agent skills</text>
</svg>